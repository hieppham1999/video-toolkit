name: video_toolkit
description: "A video encoding toolkit app for Windows and macOS."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_easyloading: ^3.0.5

  # Platform UI
  fluent_ui: ^4.9.0
  macos_ui: ^2.0.0

  # State management
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.0.6

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # File handling
  file_picker: ^8.1.2
  desktop_drop: ^0.4.4
  path: ^1.9.0
  path_provider: ^2.1.4

  # Serialization
  json_annotation: ^4.9.0

  # Color picker
  flutter_colorpicker: ^1.1.0

  logger: ^2.5.0

  # Date formatting
  intl: any

  # App metadata
  package_info_plus: ^8.0.0
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: ^3.0.6
  injectable_generator: ^2.6.2
  json_serializable: ^6.9.5
  flutter_gen_runner: ^5.10.0

flutter:
  uses-material-design: true
  generate: true

  # Note: bundled CLI tools (ffmpeg, ffprobe, exiftool) are NOT declared as
  # Flutter assets. They are shipped via native build steps so each platform
  # only includes its own binaries:
  #   - Windows: windows/CMakeLists.txt installs assets/bin/{ffmpeg,exiftool}/windows
  #     into <app>/data/bin/ next to the exe.
  #   - macOS: Xcode "Copy Bundled Binaries" build phase rsyncs
  #     assets/bin/{ffmpeg,exiftool}/macos into Runner.app/Contents/Resources/bin.
  # In dev (flutter run), BundledBinaryResolver._devAssetPath walks up from
  # the executable to find the source assets directly.
  assets:
    - assets/fonts/
