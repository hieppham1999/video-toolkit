name: video_toolkit
description: "A video toolkit app for Windows and macOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_easyloading: ^3.0.5

  # Platform UI
  fluent_ui: ^4.9.0
  macos_ui: ^2.0.0

  # State management
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.0.6

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # File handling
  file_picker: ^8.1.2
  desktop_drop: ^0.4.4
  path: ^1.9.0
  path_provider: ^2.1.4

  # Serialization
  json_annotation: ^4.9.0

  # Color picker
  flutter_colorpicker: ^1.1.0

  logger: ^2.5.0

  # Date formatting
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: ^3.0.6
  injectable_generator: ^2.6.2
  json_serializable: ^6.9.5
  flutter_gen_runner: ^5.10.0

flutter:
  uses-material-design: true
  generate: true

assets:
  - assets/bin/ffmpeg/windows/
  - assets/bin/ffmpeg/macos/
  - assets/fonts/
